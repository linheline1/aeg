# Loaded from /etc/nginx/conf.d/ inside nginx's http block.
# Keep gzip on in /etc/nginx/nginx.conf; this file defines compressible types.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;
