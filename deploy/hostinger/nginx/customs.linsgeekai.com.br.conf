# AEG DDP 报关行端 — customs.linsgeekai.com.br
server {
    listen 443 ssl http2;
    server_name customs.linsgeekai.com.br;

    ssl_certificate     /etc/letsencrypt/live/customs.linsgeekai.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customs.linsgeekai.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/aeg-ddp/apps/web-customs/dist;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
}

server {
    listen 80;
    server_name customs.linsgeekai.com.br;
    return 301 https://$host$request_uri;
}
