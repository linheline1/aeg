# AEG DDP 管理端 — admin.domain.com
# 部署位置：/opt/aeg-ddp/apps/web-admin/dist/
server {
    listen 443 ssl http2;
    server_name admin.domain.com;

    # SSL 证书由 certbot 申请后填入
    ssl_certificate     /etc/letsencrypt/live/admin.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.domain.com/privkey.pem;

    # HSTS（certbot 自动加上）
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/aeg-ddp/apps/web-admin/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（仅后端 localhost）
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name admin.domain.com;
    return 301 https://$host$request_uri;
}
