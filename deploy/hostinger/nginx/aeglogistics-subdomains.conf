# Separate operations portals on dedicated HTTPS subdomains.
map $host $aeg_portal_root {
    default /var/www/html;
    ops.aeglogistics.com.br /opt/aeg-ddp-release-07e37b7/apps/web-ops/dist-subdomain;
    admin.aeglogistics.com.br /opt/aeg-ddp-release-07e37b7/apps/web-admin/dist-subdomain;
    customs.aeglogistics.com.br /opt/aeg-ddp-release-07e37b7/apps/web-customs/dist-subdomain;
}

server {
    listen 443 ssl http2;
    server_name ops.aeglogistics.com.br admin.aeglogistics.com.br customs.aeglogistics.com.br;
    ssl_certificate /etc/letsencrypt/live/ops.aeglogistics.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.aeglogistics.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root $aeg_portal_root;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name ops.aeglogistics.com.br admin.aeglogistics.com.br customs.aeglogistics.com.br;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
