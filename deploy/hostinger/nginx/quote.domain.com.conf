# AEG DDP 客户端 — quote.domain.com
server {
    listen 443 ssl http2;
    server_name quote.domain.com;

    ssl_certificate     /etc/letsencrypt/live/quote.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quote.domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/aeg-ddp/apps/web-client/dist;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    # 上传模板下载 /api/client/template/xxx/download
    # 后端鉴权 + 从磁盘流式返回，不暴露上传目录本身
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
}

server {
    listen 80;
    server_name quote.domain.com;
    return 301 https://$host$request_uri;
}
